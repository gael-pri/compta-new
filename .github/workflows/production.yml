name: deploy to production

on:
  push:
    branches: [ production ]

permissions:
  contents: read
  packages: write

jobs:
  deploy_production:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP_PRODUCTION }} >> ~/.ssh/known_hosts

      - name: Get current date and set app name
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "myapp=compta-new" >> $GITHUB_ENV
          echo "environnement=production" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract repository name in lowercase
        id: repo_name
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./frontend
          tags: |
            ghcr.io/${{ env.REPO_NAME }}-${{ env.environnement }}-frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_NAME }}-${{ env.environnement }}-frontend:latest
          build-args: |
            CACHEBUST=${{ github.sha }}
            VITE_BACKEND_PROVIDER=${{ secrets.VITE_BACKEND_PROVIDER }}
            VITE_DIRECTUS_URL=${{ secrets.VITE_DIRECTUS_URL }}

      - name: Authenticate Docker on the server
        run: |
          ssh -i ~/.ssh/id_rsa gael@${{ secrets.SERVER_IP_PRODUCTION }} "
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          "

      - name: Deploy production on vps
        run: |
          ssh -i ~/.ssh/id_rsa gael@${{ secrets.SERVER_IP_PRODUCTION }} "
            cd /srv/projets/${{ env.environnement }}/${{ env.myapp }} &&
            docker compose -f docker-compose.yml pull &&
            docker compose -f docker-compose.yml up -d
          "

      - name: Clean up Docker on Server
        run: |
          ssh -i ~/.ssh/id_rsa gael@${{ secrets.SERVER_IP_PRODUCTION }} "
            docker image prune -f
          "

    concurrency:
      group: docker-build-${{ github.ref }}
      cancel-in-progress: true
